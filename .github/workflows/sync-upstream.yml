name: Sync Lab Material & Skills

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-lab]

concurrency:
  group: sync-lab-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check upstream tree SHAs (2s pre-check)
        id: tree_check
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
          UPSTREAM_REPO: ${{ secrets.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ secrets.UPSTREAM_BRANCH }}
          UPSTREAM_BASE_PATH: ${{ secrets.UPSTREAM_BASE_PATH }}
          SETUP_REPO: ${{ secrets.SETUP_REPO }}
        run: |
          set -euo pipefail

          UPSTREAM_JSON=$(gh api "repos/${UPSTREAM_REPO}/contents/${UPSTREAM_BASE_PATH}?ref=${UPSTREAM_BRANCH}")
          UPSTREAM_LAB_SHA=$(echo "$UPSTREAM_JSON" | jq -r '.[] | select(.name == "lab_material" and .type == "dir") | .sha')
          UPSTREAM_SKILLS_SHA=$(echo "$UPSTREAM_JSON" | jq -r '.[] | select(.name == "skills" and .type == "dir") | .sha')
          UPSTREAM_SETUP_SHA=$(gh api "repos/${SETUP_REPO}/commits/main" --jq '.commit.tree.sha')

          if [[ -z "$UPSTREAM_LAB_SHA" || -z "$UPSTREAM_SKILLS_SHA" || -z "$UPSTREAM_SETUP_SHA" ]]; then
            echo "::error::Failed to resolve upstream tree SHAs"
            exit 1
          fi

          STATE_FILE=".github/.sync-state"
          LOCAL_LAB_SHA="none"
          LOCAL_SKILLS_SHA="none"
          LOCAL_SETUP_SHA="none"

          if [[ -f "$STATE_FILE" && -d "lab_material" && -d "skills" && -d "bwg-lab-setup" ]]; then
            LOCAL_LAB_SHA=$(grep '^lab_material=' "$STATE_FILE" | cut -d= -f2 || echo "none")
            LOCAL_SKILLS_SHA=$(grep '^skills=' "$STATE_FILE" | cut -d= -f2 || echo "none")
            LOCAL_SETUP_SHA=$(grep '^bwg_lab_setup=' "$STATE_FILE" | cut -d= -f2 || echo "none")
          fi

          echo "lab_material  -> upstream: ${UPSTREAM_LAB_SHA} | synced: ${LOCAL_LAB_SHA}"
          echo "skills        -> upstream: ${UPSTREAM_SKILLS_SHA} | synced: ${LOCAL_SKILLS_SHA}"
          echo "bwg-lab-setup -> upstream: ${UPSTREAM_SETUP_SHA} | synced: ${LOCAL_SETUP_SHA}"

          CORE_CHANGED="false"
          SETUP_CHANGED="false"

          if [[ "$UPSTREAM_LAB_SHA" != "$LOCAL_LAB_SHA" || "$UPSTREAM_SKILLS_SHA" != "$LOCAL_SKILLS_SHA" ]]; then
            CORE_CHANGED="true"
          fi

          if [[ "$UPSTREAM_SETUP_SHA" != "$LOCAL_SETUP_SHA" ]]; then
            SETUP_CHANGED="true"
          fi

          echo "core_changed=${CORE_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "setup_changed=${SETUP_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "upstream_lab_sha=${UPSTREAM_LAB_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_skills_sha=${UPSTREAM_SKILLS_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_setup_sha=${UPSTREAM_SETUP_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "$CORE_CHANGED" == "false" && "$SETUP_CHANGED" == "false" ]]; then
            echo "All tracked folders are 100% in sync. Skipping checkout."
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates detected. Proceeding with sync."
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sparse-checkout core lab_material and skills
        if: steps.tree_check.outputs.core_changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.UPSTREAM_REPO }}
          ref: ${{ secrets.UPSTREAM_BRANCH }}
          token: ${{ secrets.UPSTREAM_PAT }}
          path: _upstream_core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ${{ secrets.UPSTREAM_BASE_PATH }}/lab_material
            ${{ secrets.UPSTREAM_BASE_PATH }}/skills

      - name: Checkout bwg-lab-setup
        if: steps.tree_check.outputs.setup_changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SETUP_REPO }}
          ref: main
          token: ${{ secrets.UPSTREAM_PAT }}
          path: _upstream_setup
          fetch-depth: 1

      - name: Sync folders and commit updates
        if: steps.tree_check.outputs.any_changed == 'true'
        env:
          UPSTREAM_BASE_PATH: ${{ secrets.UPSTREAM_BASE_PATH }}
          CORE_CHANGED: ${{ steps.tree_check.outputs.core_changed }}
          SETUP_CHANGED: ${{ steps.tree_check.outputs.setup_changed }}
          UPSTREAM_LAB_SHA: ${{ steps.tree_check.outputs.upstream_lab_sha }}
          UPSTREAM_SKILLS_SHA: ${{ steps.tree_check.outputs.upstream_skills_sha }}
          UPSTREAM_SETUP_SHA: ${{ steps.tree_check.outputs.upstream_setup_sha }}
        run: |
          set -euo pipefail

          if [[ "$CORE_CHANGED" == "true" ]]; then
            mkdir -p lab_material skills
            rsync -av --delete \
              --exclude='images/specs' \
              "_upstream_core/${UPSTREAM_BASE_PATH}/lab_material/" "lab_material/"
            rsync -av --delete \
              "_upstream_core/${UPSTREAM_BASE_PATH}/skills/" "skills/"
            rm -rf _upstream_core
          fi

          if [[ "$SETUP_CHANGED" == "true" ]]; then
            mkdir -p bwg-lab-setup
            rsync -av --delete \
              --exclude='.git' \
              --exclude='.github' \
              "_upstream_setup/" "bwg-lab-setup/"
            rm -rf _upstream_setup
          fi

          cat > .github/.sync-state <<EOF
          lab_material=${UPSTREAM_LAB_SHA}
          skills=${UPSTREAM_SKILLS_SHA}
          bwg_lab_setup=${UPSTREAM_SETUP_SHA}
          EOF

          git add lab_material skills bwg-lab-setup .github/.sync-state

          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sync): update lab_material, skills, and bwg-lab-setup"
          git push origin HEAD:main
